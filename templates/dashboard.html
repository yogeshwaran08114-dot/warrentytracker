<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WarrantyHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="logo">
                <h1>WarrantyHub</h1>
                <span class="tagline">Register • Track • Protect</span>
            </div>
            <nav>
                <a href="#" class="nav-link active">Dashboard</a>
                <a href="#" class="nav-link">My Warranties</a>
                <a href="#" class="nav-link">Products</a>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </nav>
        </header>
        <main class="dashboard-main">
            <section class="welcome-section">
                <h2>Welcome to WarrantyHub</h2>
                <p>Register your products, monitor warranty status, and keep all your warranty information secure in one place.</p>
            </section>
            <section class="stats-section">
                <div class="stat-card">
                    <h3>Active Warranties</h3>
                    <p class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Expiring Soon</h3>
                    <p class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Products</h3>
                    <p class="stat-number">0</p>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
